# Debug tooling layered onto the hooin container on top of the ubuntu base.
#
# These replace the `RUN apt install` steps of the Containerfile. rules_img
# cannot execute RUN steps, so the packages are resolved and downloaded as
# .debs by rules_distroless and composed into a layer. `curl` already ships in
# the ubuntu base image, so only the packages missing from it live here.
#
# Whenever this file changes, regenerate the lockfile:
#
#     bazel run @seed_newtype_hooin_container_apt//:lock
version: 1

sources:
  - channel: resolute main
    url: https://snapshot.ubuntu.com/ubuntu/20260901T000000Z
  - channel: resolute-security main
    url: https://snapshot.ubuntu.com/ubuntu/20260901T000000Z
  - channel: resolute-updates main
    url: https://snapshot.ubuntu.com/ubuntu/20260901T000000Z

archs:
  - "amd64"

packages:
  - "gnupg"
  - "lsb-release"
