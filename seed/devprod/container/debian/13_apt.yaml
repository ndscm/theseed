# APT packages layered onto the debian 13 (trixie) base image.
#
# This replaces the `RUN apt install` steps of the Containerfile. rules_img
# cannot execute RUN steps, so the packages are resolved and downloaded as
# .debs by rules_distroless and composed into a layer.
#
# Whenever this file changes, regenerate the lockfile:
#
#     bazel run @seed_devprod_container_debian_13_apt//:lock
version: 1

sources:
  - channel: trixie main
    url: https://snapshot.debian.org/archive/debian/20260801T000000Z
  - channel: trixie-updates main
    url: https://snapshot.debian.org/archive/debian/20260801T000000Z
  - channel: trixie-security main
    url: https://snapshot.debian.org/archive/debian-security/20260801T000000Z

archs:
  - "amd64"

packages:
  - "ca-certificates"
  - "curl"
  - "iputils-ping"
