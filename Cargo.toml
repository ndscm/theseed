[workspace]
resolver = "3"
members = [
    "seed/devprod/dotslash/update",
    "seed/devprod/starter/rustcli",
]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ferris-says = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
codegen-units = 1
lto = true
strip = true
